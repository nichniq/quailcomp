name: CI

on:
  push:
    branches: [main, claude-dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install

      - name: Setup database
        run: |
          cd data/postgres/setup
          ./run.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Run migrations
        run: bun run db:migrate
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: quailcomp_owner
          PGPASSWORD: quailcomp_owner_password
          PGDATABASE: quailcomp

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: quailcomp_app
          PGPASSWORD: quailcomp_app_password
          PGDATABASE: quailcomp_test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint
